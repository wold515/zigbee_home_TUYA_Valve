general:
  board: custom_promicro_nrf52840/nrf52840

board:
  is_router: true
  bootloader: adafruit_nrf52_sd140_v6
  
  buttons:
    - id: button1
      pin: "1.15"
    - id: leak_pin1
      pin: "0.06"
      inverted: true
    - id: leak_pin2
      pin: "0.08"
      inverted: true

sensors:
  # КРАН 1 (Холодная вода)
  - type: on_off
    pin: "0.20"
    control_button: button1

  # КРАН 2 (Горячая вода)
  - type: on_off
    pin: "0.22"

  # ДАТЧИК ПРОТЕЧКИ 1
  - type: ias_zone
    zone_type: "contact"
    button: leak_pin1

  # ДАТЧИК ПРОТЕЧКИ 2
  - type: ias_zone
    zone_type: "contact"
    button: leak_pin2
