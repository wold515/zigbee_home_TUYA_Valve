general:
  board: custom_promicro_nrf52840/nrf52840

board:
  is_router: true
  bootloader: adafruit_nrf52_sd140_v6
  
  # Короткая и корректная запись кнопок (они автоматически инвертированы на GND)
  buttons:
    - id: button1
      pin: "1.15"
    - id: leak_pin1
      pin: "0.06"
    - id: leak_pin2
      pin: "0.08"

sensors:
  # КРАН 1 (Холодная вода)
  - type: on_off
    pin: "0.20"
    control_button: button1

  # КРАН 2 (Горячая вода)
  - type: on_off
    pin: "0.22"

  # ВИРТУАЛЬНЫЙ ДАТЧИК 1 (Привязан к физическому пину 4 через leak_pin1)
  - type: on_off
    control_button: leak_pin1

  # ВИРТУАЛЬНЫЙ ДАТЧИК 2 (Привязан к физическому пину 5 через leak_pin2)
  - type: on_off
    control_button: leak_pin2
