general:
  # Возвращаем стандартную плату Zephyr, чтобы компилятор не падал
  board: nrf52840dongle_nrf52840

board:
  is_router: true
  
  # Короткая запись кнопок (порты сверяем по схеме nRF52840 Dongle)
  buttons:
    - id: button1
      pin: "1.15"
    - id: leak_pin1
      pin: "0.06"
    - id: leak_pin2
      pin: "0.08"

sensors:
  # КРАН 1 (Холодная вода) — физический выход
  - type: on_off
    pin: "0.20"
    control_button: button1

  # КРАН 2 (Горячая вода) — физический выход
  - type: on_off
    pin: "0.22"

  # ДАТЧИК ПРОТЕЧКИ 1
  - type: on_off
    pin: "0.06"
    control_button: leak_pin1

  # ДАТЧИК ПРОТЕЧКИ 2
  - type: on_off
    pin: "0.08"
    control_button: leak_pin2
