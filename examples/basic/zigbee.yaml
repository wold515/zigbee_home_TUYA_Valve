general:
  board: custom_promicro_nrf52840/nrf52840

board:
  bootloader: adafruit_nrf52_sd140_v6
  
  factory_reset_button: btn1
  buttons:
    - id: btn1
      pin: 1.15

  # Переносим реле внутрь секции board, как требует парсер
  outputs:
    - id: relay1
      type: gpio
      pin: 0.20
      inverted: false
