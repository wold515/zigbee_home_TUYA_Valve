general:
  board: custom_promicro_nrf52840/nrf52840

board:
  is_router: true
  bootloader: adafruit_nrf52_sd140_v6
  
  buttons:
    - id: button1
      pin:
        port: 1
        pin: 15

sensors:
  # Наш кран (реле)
  - type: on_off
    pin:
      port: 0
      pin: 20            # Пин 9 на плате SuperMini
    control_button: button1

  # ПРОВОДНОЙ ДАТЧИК ПРОТЕЧКИ 1
  - type: on_off         # В Zigbee бинарные входы часто описываются как on_off или binary_input
    name: "Wired Leak Sensor 1"
    pin:
      port: 0
      pin: 6             # Это пин 4 на плате SuperMini
      pull: pull_up      # Внутренняя подтяжка к 3.3В

  # ПРОВОДНОЙ ДАТЧИК ПРОТЕЧКИ 2 (если нужно в другое место подтянуть)
  - type: on_off
    name: "Wired Leak Sensor 2"
    pin:
      port: 0
      pin: 8             # Это пин 5 на плате SuperMini
      pull: pull_up
