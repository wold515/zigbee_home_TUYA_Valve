general:
  # Обязательно указываем SoC через слэш, как требует функция resolveBoardSoC в коде
  board: custom_promicro_nrf52840/nrf52840

board:
  is_router: true
  bootloader: adafruit_nrf52_sd140_v6
  enable_watchdog: true

  # ШТАТНАЯ ИНДИКАЦИЯ: Привязываем системный статус сети к нашему светодиоду ниже
  network_state_led: status_led

  # Описываем светодиод короткой строкой через ID
  leds:
    - id: status_led
      pin: "0.15"        # Синий светодиод платы SuperMini (P0.15)

  # Физические входы датчиков протечек и кнопка
  buttons:
    - id: button1
      pin: "1.15"
    - id: leak_pin1
      pin: "0.06"
    - id: leak_pin2
      pin: "0.08"

sensors:
  # КРАН 1 (Холодная вода) — пин 9 (P0.20)
  - type: on_off
    pin: "0.20"
    control_button: button1

  # КРАН 2 (Горячая вода) — пин 10 (P0.22)
  - type: on_off
    pin: "0.22"

  # ДАТЧИК ПРОТЕЧКИ 1 (Виртуальный переключатель, слушающий leak_pin1 на P0.06)
  - type: on_off
    control_button: leak_pin1

  # ДАТЧИК ПРОТЕЧКИ 2 (Слушает leak_pin2 на P0.08)
  - type: on_off
    control_button: leak_pin2
