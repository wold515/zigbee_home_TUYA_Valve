general:
  board: custom_promicro_nrf52840/nrf52840

board:
  is_router: true
  bootloader: adafruit_nrf52_sd140_v6
  enable_watchdog: true

  # Системная индикация сети
  network_state_led: status_led

  leds:
    - id: status_led
      pin: "0.15"        # Синий светодиод SuperMini (P0.15)

  # Физические входы (Кнопка сброса на P1.15 и 2 провода датчиков на P0.06 и P0.08)
  buttons:
    - id: button1
      pin: "1.15"
    - id: leak_pin1
      pin: "0.06"
    - id: leak_pin2
      pin: "0.08"

sensors:
  # КРАН 1 (Холодная вода) — физический выход на пине 9 (P0.20)
  - type: on_off
    pin: "0.20"
    control_button: button1

  # КРАН 2 (Горячая вода) — физический выход на пине 10 (P0.22)
  - type: on_off
    pin: "0.22"

  # ДАТЧИК ПРОТЕЧКИ 1 (Виртуальный переключатель, привязанный к кнопке leak_pin1)
  # Направляем виртуальный выход на неиспользуемый пин P0.00, чтобы не было конфликта!
  - type: on_off
    pin: "0.00"
    control_button: leak_pin1

  # ДАТЧИК ПРОТЕЧКИ 2 (Привязан к кнопке leak_pin2)
  # Направляем виртуальный выход на неиспользуемый пин P0.01
  - type: on_off
    pin: "0.01"
    control_button: leak_pin2
