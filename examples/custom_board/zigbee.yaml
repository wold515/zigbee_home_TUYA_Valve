general:
  board: custom_promicro_nrf52840/nrf52840

board:
  is_router: true
  bootloader: adafruit_nrf52_sd140_v6
  
  # Настройка встроенного светодиода для отображения статуса сети
  debug:
    enabled: false       # Оставляем false, чтобы не блокировать вочдог
    leds:
      enabled: true      # Включаем индикацию статусов платы
      power: status_led  # Привязываем системный светодиод к нашему id ниже

  # Описываем физические светодиоды платы
  leds:
    - id: status_led
      pin: "0.15"        # Синий системный светодиод на плате SuperMini (P0.15)

  # Физические входы (Кнопка сброса на P1.15 и 2 провода датчиков протечки)
  buttons:
    - id: button1
      pin: "1.15"
    - id: leak_pin1
      pin: "0.06"
    - id: leak_pin2
      pin: "0.08"

sensors:
  # КРАН 1 (Холодная вода) — пин 9 (P0.20)
  - type: on_off
    pin: "0.20"
    control_button: button1

  # КРАН 2 (Горячая вода) — пин 10 (P0.22)
  - type: on_off
    pin: "0.22"

  # ДАТЧИК ПРОТЕЧКИ 1 (Виртуальный переключатель, слушающий leak_pin1 на P0.06)
  - type: on_off
    control_button: leak_pin1

  # ДАТЧИК ПРОТЕЧКИ 2 (Слушает leak_pin2 на P0.08)
  - type: on_off
    control_button: leak_pin2
