name: Build Zigbee Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          tags: local-zigbee-home:latest
          outputs: type=docker,dest=/tmp/image.tar

      - name: Load Local Docker Image
        run: |
          docker load --input /tmp/image.tar

      - name: Compile Firmware inside Container
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace local-zigbee-home:latest python3 -m zigbee_home compile valve_supermini.yaml

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: supermini-valve-firmware
          path: .zigbee_home/build/zephyr/zephyr.uf2
