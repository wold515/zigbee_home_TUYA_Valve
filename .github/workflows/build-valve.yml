name: Build Single Valve Firmware

on:
  workflow_dispatch:

env:
  ZIGBEE_ADD_ON_VERSION: v1.2.1
  TOOLCHAIN_VERSION: v3.1.1
  GO_VERSION: "1.24"
  NRFUTIL_VERSION: "8.1.1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build executable
        run: |
          go build -o zigbee_home ./cmd/zigbee_home/
          chmod +x ./zigbee_home

      - name: Download nrfutil
        env:
          BASE_URL: https://nordicsemi.com
        run: |
          wget --progress=dot:mega -O nrfutil.tar.gz ${BASE_URL}/nrfutil-x86_64-unknown-linux-gnu-${NRFUTIL_VERSION}.tar.gz
          tar -xOf ./nrfutil.tar.gz nrfutil-x86_64-unknown-linux-gnu-${NRFUTIL_VERSION}/data/bin/nrfutil > nrfutil
          rm ./nrfutil.tar.gz
          chmod +x nrfutil

      - name: Install Toolchain and SDK managers
        run: |
          ./nrfutil install toolchain-manager

      - name: Download Toolchain and SDK
        run: |
          ./nrfutil toolchain-manager install --ncs-version ${TOOLCHAIN_VERSION}
          mkdir -p ~/ncs/zigbee_sdk_${ZIGBEE_ADD_ON_VERSION}
          ./nrfutil toolchain-manager launch --chdir ~/ncs/zigbee_sdk_${ZIGBEE_ADD_ON_VERSION} --ncs-version ${TOOLCHAIN_VERSION} -- \
          bash -c 'west init -m "http://github.com" --mr ${ZIGBEE_ADD_ON_VERSION} && west update -o=--depth=1 -n'

      - name: Compile Valve Firmware
        env:
          NO_SETUP_ENV: 1
          ZBHOME_BOARD: promicro_nrf52840  # Указываем таргет для SuperMini
        run: |
          export ZEPHYR_BASE=~/ncs/zigbee_sdk_${ZIGBEE_ADD_ON_VERSION}/zephyr
          ./nrfutil toolchain-manager launch --ncs-version ${TOOLCHAIN_VERSION} -- bash -c './zigbee_home firmware --workdir . build --config valve_supermini.yaml'

      - name: Upload Finished Firmware
        uses: actions/upload-artifact@v4
        with:
          name: supermini-valve-firmware
          path: |
            build/zephyr/zephyr.uf2
            build/zephyr/zephyr.hex
