name: Build Zigbee Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install West
        run: |
          pip install --upgrade pip
          pip install west

      - name: Initialize West Workspace
        run: |
          # Инициализируем только манифест, без скачивания всего SDK
          west init -l . || true
          
      - name: Install zigbee_home CLI
        run: |
          pip install .

      - name: Compile Firmware via CLI
        run: |
          # Флаг --local или прямая сборка через python-модуль
          python3 -m zigbee_home compile valve_supermini.yaml

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: supermini-valve-firmware
          path: .zigbee_home/build/zephyr/zephyr.uf2
