name: Build Zigbee Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      # Используем официальный открытый Docker-образ от Nordic Semiconductor
      image: nordicsemi/nrfconnect-sdk:v2.5.0

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install local zigbee_home package
        run: |
          pip3 install --upgrade pip
          pip3 install .

      - name: Compile Firmware
        run: |
          python3 -m zigbee_home compile valve_supermini.yaml

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: supermini-valve-firmware
          path: .zigbee_home/build/zephyr/zephyr.uf2
