name: Build Single Valve Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile via Docker Hub Image
        run: |
          # Используем открытый Docker-контейнер прямо внутри шага сборки, пробрасывая текущую папку
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace ghcr.io/ffenix113/zigbee_home:latest python3 -m zigbee_home compile valve_supermini.yaml

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: supermini-valve-firmware
          path: .zigbee_home/build/zephyr/zephyr.uf2
