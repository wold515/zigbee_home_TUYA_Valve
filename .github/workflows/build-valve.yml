name: Build Single Valve Firmware

on:
  workflow_dispatch:

env:
  ZIGBEE_ADD_ON_VERSION: v1.2.1
  TOOLCHAIN_VERSION: v3.1.1
  GO_VERSION: "1.24"
  NRFUTIL_VERSION: "8.1.1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build executable
        run: |
          go build -o zigbee_home ./cmd/zigbee_home/
          chmod +x ./zigbee_home

      - name: Download nrfutil
        run: |
          wget https://nordicsemi.com{{ env.NRFUTIL_VERSION }}.tar.gz
          tar -xf nrfutil-x86_64-unknown-linux-gnu-${{ env.NRFUTIL_VERSION }}.tar.gz
          mv nrfutil-x86_64-unknown-linux-gnu-${{ env.NRFUTIL_VERSION }}/data/bin/nrfutil ./nrfutil
          chmod +x nrfutil

      - name: Install Toolchain Manager
        run: |
          ./nrfutil toolchain-manager install

      - name: Install NCS Toolchain
        run: |
          ./nrfutil toolchain-manager install --ncs-version ${{ env.TOOLCHAIN_VERSION }}

      - name: Compile Valve Firmware
        env:
          NO_SETUP_ENV: 1
          ZBHOME_BOARD: promicro_nrf52840
        run: |
          ./nrfutil toolchain-manager launch --ncs-version ${{ env.TOOLCHAIN_VERSION }} -- bash -c './zigbee_home firmware --workdir . build --config valve_supermini.yaml'

      - name: Upload Finished Firmware
        uses: actions/upload-artifact@v4
        with:
          name: supermini-valve-firmware
          path: |
            build/zephyr/zephyr.uf2
            build/zephyr/zephyr.hex
