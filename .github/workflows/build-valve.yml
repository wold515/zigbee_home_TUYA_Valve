name: Build Zigbee Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-python-version: '3.10'

      - name: Install zigbee_home
        run: |
          pip install --upgrade pip
          pip install .

      - name: Compile Firmware
        run: |
          python3 -m zigbee_home compile valve_supermini.yaml

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: supermini-valve-firmware
          path: .zigbee_home/build/zephyr/zephyr.uf2
